<svg width="0" height="0" style="position: absolute;">
  <defs>
    <pattern id="crosshatch" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M-1,1 l2,-2 M0,8 l8,-8 M7,9 l2,-2" stroke="black" stroke-width="1"/>
    </pattern>
  </defs>
</svg>

<div class="card block mb-0">
  <div class="card-content p-0 is-clipped">
    <map2 #map [layers]="LAYERS" [height]="height"></map2>
  </div>
  <div class="card-content" resize #cardNonMap>
    <div class="is-flex is-justify-content-flex-end">
      <p>{{date.toDate() | date:'EEEE, MMMM d'}}</p>
    </div>
    <input
      class="slider is-fullwidth is-primary" 
      style="transform: rotate(180deg);"
      step="1" 
      min="0" 
      max="13"
      [(ngModel)]="dateOffset"
      (ngModelChange)="onDateUpdate()"
      type="range"
    >
  </div>
</div>
